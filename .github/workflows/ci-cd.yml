name: CI-CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      show_deploy_note:
        description: "Show why the local VirtualBox VM cannot be deployed from GitHub Actions"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  IMAGE_LATEST: ${{ secrets.DOCKER_USER }}/myapp:latest
  IMAGE_SHA: ${{ secrets.DOCKER_USER }}/myapp:${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Docker Hub login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Docker image build
        run: docker build -t "$IMAGE_LATEST" -t "$IMAGE_SHA" .

      - name: Docker image push latest
        run: docker push "$IMAGE_LATEST"

      - name: Docker image push commit SHA
        run: docker push "$IMAGE_SHA"

      # Local VirtualBox VM 127.0.0.1:2222 GitHub-hosted runner tarafindan erisilemez.
      # GitHub Actions icinde 127.0.0.1 runner'in kendisidir, kullanicinin bilgisayari degildir.
      # Gercek deploy icin public IP'li bir sunucu gerekir.
      # Bu nedenle Ansible deploy otomatik calistirilmaz; local demo icin scripts/local-deploy.sh kullanilir.
      - name: Local VM deploy note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.show_deploy_note == 'true' }}
        run: |
          echo "Local VirtualBox VM 127.0.0.1:2222 GitHub-hosted runner tarafindan erisilemez."
          echo "GitHub Actions icinde 127.0.0.1 runner'in kendisidir, kullanicinin bilgisayari degildir."
          echo "Gercek deploy icin public IP'li bir sunucu gerekir."
          echo "Bu projede Ansible deploy local demo olarak scripts/local-deploy.sh ile calistirilir."
