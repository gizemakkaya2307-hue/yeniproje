name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/myapp:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo cek
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Image build
        run: docker build -t "$IMAGE_NAME" .

      - name: Image push
        run: docker push "$IMAGE_NAME"

      - name: Ansible kur
        run: |
          sudo apt update
          sudo apt install ansible -y

      - name: SSH key ekle
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Inventory olustur
        run: |
          printf "[web]\n%s ansible_user=%s\n" "${{ secrets.SERVER_HOST }}" "${{ secrets.SERVER_USER }}" > ansible/inventory.ini

      - name: Deploy
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --extra-vars "docker_image=$IMAGE_NAME"
